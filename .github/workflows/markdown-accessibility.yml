name: Markdown Accessibility Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  check-h1-headings:
    runs-on: ubuntu-latest
    name: Check H1 Headings in Markdown Files
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for level-one headings
        run: |
          chmod +x .github/scripts/check-h1-headings.sh
          ./.github/scripts/check-h1-headings.sh
        shell: bash

  check-html-lang:
    runs-on: ubuntu-latest
    name: Check HTML Lang Attribute (WCAG 3.1.1 / html-has-lang)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML files for lang attribute on <html> element
        run: |
          chmod +x tests/check-html-lang.sh
          ./tests/check-html-lang.sh
        shell: bash
