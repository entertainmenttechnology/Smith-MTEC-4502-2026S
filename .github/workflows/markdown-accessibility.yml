name: Markdown Accessibility Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  check-h1-headings:
    runs-on: ubuntu-latest
    name: Check H1 Headings in Markdown Files
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for level-one headings
        run: |
          chmod +x .github/scripts/check-h1-headings.sh
          ./.github/scripts/check-h1-headings.sh
        shell: bash

  check-landmark-regions:
    runs-on: ubuntu-latest
    name: Check Landmark Region Accessibility (axe region rule)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check student-information.md for landmark-compatible structure
        run: |
          chmod +x tests/test-student-information-accessibility.sh
          ./tests/test-student-information-accessibility.sh
        shell: bash
