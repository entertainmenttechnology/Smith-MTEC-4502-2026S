name: Markdown Accessibility Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  check-h1-headings:
    runs-on: ubuntu-latest
    name: Check H1 Headings in Markdown Files
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for level-one headings
        run: |
          chmod +x .github/scripts/check-h1-headings.sh
          ./.github/scripts/check-h1-headings.sh
        shell: bash

  check-readme-region-landmarks:
    runs-on: ubuntu-latest
    name: Check README.md Landmark/Region Accessibility (axe region rule)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README.md for landmark/region compliance
        run: |
          chmod +x tests/test-readme-region-landmarks.sh
          ./tests/test-readme-region-landmarks.sh
        shell: bash
