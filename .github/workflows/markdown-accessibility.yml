name: Markdown Accessibility Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  check-h1-headings:
    runs-on: ubuntu-latest
    name: Check H1 Headings in Markdown Files
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for level-one headings
        run: |
          chmod +x .github/scripts/check-h1-headings.sh
          ./.github/scripts/check-h1-headings.sh
        shell: bash

  check-lang-attribute:
    runs-on: ubuntu-latest
    name: Check lang Front Matter in Markdown Files (html-has-lang)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for lang front matter
        run: |
          chmod +x .github/scripts/check-lang-attribute.sh
          ./.github/scripts/check-lang-attribute.sh
        shell: bash
