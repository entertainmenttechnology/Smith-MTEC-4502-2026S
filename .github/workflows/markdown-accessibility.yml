name: Markdown Accessibility Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  check-h1-headings:
    runs-on: ubuntu-latest
    name: Check H1 Headings in Markdown Files
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for level-one headings
        run: |
          chmod +x .github/scripts/check-h1-headings.sh
          ./.github/scripts/check-h1-headings.sh
        shell: bash

  check-main-landmark:
    runs-on: ubuntu-latest
    name: Check Main Landmark in Living Job Taxonomy
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for main landmark in Living Job Taxonomy
        run: |
          chmod +x tests/test-living-job-taxonomy-main-landmark.sh
          ./tests/test-living-job-taxonomy-main-landmark.sh
        shell: bash
