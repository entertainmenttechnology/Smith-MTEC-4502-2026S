name: Accessibility Scanner
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  scan-accessibility:
    runs-on: ubuntu-latest
    name: Scan Course Materials for Accessibility Issues
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-discover all markdown files
        id: discover
        shell: bash
        run: |
          # Find all markdown files and convert to GitHub.com URLs
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          BASE_URL="https://github.com/${REPO}/blob/${BRANCH}"
          
          # Generate URL list (excluding .git directory)
          URLS=$(find . -name "*.md" -type f | grep -v ".git" | sed 's|^\./||' | sort | while read -r file; do
            # URL encode spaces and special characters
            encoded_file=$(echo "$file" | sed 's/ /%20/g')
            echo "${BASE_URL}/${encoded_file}"
          done | tr '\n' '|')
          
          # Remove trailing pipe and convert to newline-delimited
          URLS=${URLS%|}
          URLS=$(echo "$URLS" | tr '|' '\n')
          
          # Output for debugging
          echo "Found markdown files:"
          echo "$URLS"
          
          # Set output using multiline format
          echo "urls<<EOF" >> $GITHUB_OUTPUT
          echo "$URLS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Scan accessibility on GitHub.com URLs
        uses: github/accessibility-scanner@v2
        with:
          # Dynamically generated URLs from all markdown files in the repository
          urls: ${{ steps.discover.outputs.urls }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GH_TOKEN }}
          cache_key: a11y-scan-mtec4502-${{ github.ref_name }}
          skip_copilot_assignment: false  # Set to true if you don't want Copilot to propose fixes
          # Authenticate with GitHub so that GitHub's own UI (e.g. the "Signing in" link
          # shown to unauthenticated visitors) does not appear during scanning.
          # This prevents link-in-text-block violations caused by GitHub's own
          # navigation/contribute UI rather than by content in this repository.
          # To enable authentication: add GH_SCAN_USERNAME and GH_SCAN_PASSWORD as
          # repository secrets (Settings → Secrets → Actions).
          login_url: ${{ secrets.GH_SCAN_USERNAME && 'https://github.com/login' || '' }}
          username: ${{ secrets.GH_SCAN_USERNAME }}
          password: ${{ secrets.GH_SCAN_PASSWORD }}
