name: Heading Order Check
on:
  push:
    branches: [main]
    paths:
      - '**.md'
  pull_request:
    branches: [main]
    paths:
      - '**.md'

jobs:
  check-heading-order:
    runs-on: ubuntu-latest
    name: Check Markdown Heading Order
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Check heading order in markdown files
        run: |
          python3 .github/scripts/check-heading-order.py
